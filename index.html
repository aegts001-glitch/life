<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life</title>
<meta name="description" content="Личное приложение: заметки, планы, деньги, машина, объекты.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F1F2F4"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link id="touchIcon" rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Caveat:wght@500;600;700&display=swap">
<style>/* Life — личный органайзер для iPhone.
   Layout: один столбец по ширине телефона, крупные заголовки разделов, нижняя панель вкладок,
   формы во всплывающих снизу листах. Монохром из иконки + один акцентный цвет, который выбирает владелец. */
:root {
  --bg: #F1F2F4;
  --surface: #FFFFFF;
  --surface-2: #E8EAEE;
  --ink: #16181D;
  --ink-2: #5D636E;
  --ink-3: #8D939E;
  --line: #DADDE3;
  --accent: #3550E6;
  --accent-soft: rgba(53, 80, 230, .12);
  --on-accent: #FFFFFF;
  --ok: #1E8A5A;
  --warn: #C9821A;
  --bad: #CC3A3A;
  --ok-soft: rgba(30, 138, 90, .13);
  --warn-soft: rgba(201, 130, 26, .15);
  --bad-soft: rgba(204, 58, 58, .13);
  --dot: rgba(22, 24, 29, .09);
  --bar-bg: rgba(241, 242, 244, .82);
  --shadow: 0 1px 2px rgba(22, 24, 29, .06), 0 8px 24px rgba(22, 24, 29, .06);
  --scrim: rgba(10, 11, 14, .38);
  --font-display: "Unbounded", -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --font-body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --tabbar: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E11; --surface: #181A1F; --surface-2: #23262D; --ink: #F2F3F5; --ink-2: #A5ABB6; --ink-3: #737985;
    --line: #2C2F36; --dot: rgba(242, 243, 245, .07); --bar-bg: rgba(13, 14, 17, .8);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --scrim: rgba(0, 0, 0, .55);
    --ok: #3DBB82; --warn: #E6A54A; --bad: #EF6A6A;
    --ok-soft: rgba(61, 187, 130, .16); --warn-soft: rgba(230, 165, 74, .16); --bad-soft: rgba(239, 106, 106, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E11; --surface: #181A1F; --surface-2: #23262D; --ink: #F2F3F5; --ink-2: #A5ABB6; --ink-3: #737985;
  --line: #2C2F36; --dot: rgba(242, 243, 245, .07); --bar-bg: rgba(13, 14, 17, .8);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --scrim: rgba(0, 0, 0, .55);
  --ok: #3DBB82; --warn: #E6A54A; --bad: #EF6A6A;
  --ok-soft: rgba(61, 187, 130, .16); --warn-soft: rgba(230, 165, 74, .16); --bad-soft: rgba(239, 106, 106, .16);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 var(--font-body);
  overscroll-behavior-y: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--sat); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

#app { max-width: 560px; margin: 0 auto; padding-top: calc(var(--sat) + 12px); padding-bottom: calc(var(--tabbar) + var(--sab) + 28px); min-height: 100vh; }
#app.wp-dots { background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 18px 18px; background-attachment: local; }
body.wp-dots { background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 18px 18px; }
body.wp-glow { background-image: radial-gradient(120% 60% at 100% 0%, var(--accent-soft), transparent 70%); background-repeat: no-repeat; }

.view { display: grid; gap: 14px; }
.view.anim-fade { animation: vFade .24s ease-out; }
.view.anim-in { animation: vIn .3s cubic-bezier(.2, .9, .25, 1); }
.view.anim-back { animation: vBack .28s cubic-bezier(.2, .9, .25, 1); }
@keyframes vFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes vIn { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
@keyframes vBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
html.no-scroll, html.no-scroll body { overflow: hidden; }

/* Заголовок раздела */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px; }
.head h1 { margin: 0; font: 600 30px/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.head .sub { color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.head-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow); transition: transform .12s;
}
.icon-btn.primary { background: var(--accent); color: var(--on-accent); }
.icon-btn:active, .btn:active, .chip:active, .row:active, .tile:active { transform: scale(.97); }
.icon-btn svg { width: 22px; height: 22px; }

/* Кнопки */
.btn {
  min-height: 48px; padding: 0 18px; border-radius: var(--r-md); border: 0;
  background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, background .2s;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: transparent; color: var(--accent); padding: 0 8px; min-height: 40px; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 0; }

/* Карточки и списки */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 10px; font: 600 15px/1.2 var(--font-body); color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h2 .link { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 4px 0; font-size: 15px; }
.list { display: grid; gap: 2px; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--surface); border: 0; width: 100%;
  text-align: left; min-height: 56px; transition: transform .12s, background .15s; position: relative;
}
.row + .row::before, .row + .row.remark::before { content: ""; position: absolute; top: -1px; left: 16px; right: 0; height: 1px; background: var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .t, .row .m { display: block; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .m { color: var(--ink-2); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.row .r { color: var(--ink-3); font-size: 14px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.row.done .t { text-decoration: line-through; color: var(--ink-3); }
.empty { text-align: center; color: var(--ink-2); padding: 28px 16px; display: grid; gap: 12px; justify-items: center; }
.empty b { color: var(--ink); font-size: 17px; }
.section-label { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 6px 4px -6px; letter-spacing: .02em; }

/* Чипы и сегменты */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 7px;
  transition: transform .12s, background .15s;
}
.chip .n { color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.on .n { color: inherit; opacity: .7; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 38px; font-weight: 600; font-size: 15px; color: var(--ink-2); transition: background .18s, color .18s; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-work { background: #3B6FD8; } .cat-study { background: #9B5BD1; } .cat-life { background: #2E9C6A; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.none { background: var(--surface-2); color: var(--ink-2); }
.tag-ex { font-size: 12px; font-weight: 600; color: var(--ink-3); border: 1px dashed var(--ink-3); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

/* Главная */
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand span { font: 700 22px/1 var(--font-display); letter-spacing: -.02em; }
.hello h1 { margin: 6px 0 0; font: 600 28px/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.hello p { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; }
.quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
.tile {
  border: 0; background: var(--surface); border-radius: 18px; padding: 11px 2px; display: grid; justify-items: center; gap: 7px; min-width: 0;
  font-size: 11.5px; font-weight: 600; color: var(--ink); box-shadow: var(--shadow); transition: transform .12s; line-height: 1.15; text-align: center;
}
.tile .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile .ic svg { width: 22px; height: 22px; }
.big-num { font: 600 30px/1.1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big-num small { font: 500 15px var(--font-body); color: var(--ink-2); letter-spacing: 0; }
.mini-car { display: flex; align-items: center; gap: 12px; }
.mini-car svg { width: 120px; flex-shrink: 0; }
.mini-car > div { min-width: 0; }
.mini-car .pill { white-space: normal; line-height: 1.3; border-radius: 9px; }

/* Прогресс */
.bar { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left; transition: width .4s ease; }
.bar.ok i { background: var(--ok); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

/* Авто */
.car-hero { display: grid; gap: 6px; padding: 18px 16px 14px; position: relative; overflow: hidden; }
.car-hero .car-svg { width: 100%; max-width: 360px; margin: 2px auto 0; }
.car-hero .name { font: 600 24px/1.1 var(--font-display); letter-spacing: -.01em; }
.car-hero .meta { color: var(--ink-2); font-size: 15px; }
.car-hero .edit { position: absolute; right: 12px; top: 12px; }
.odo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.odo .lbl { color: var(--ink-2); font-size: 14px; }
.svc { display: grid; gap: 8px; }
.svc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.svc-meta { color: var(--ink-2); font-size: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.note-small { color: var(--ink-3); font-size: 13px; padding: 0 6px; }
.todo-add { display: flex; gap: 8px; }
.todo-add input { flex: 1; min-width: 0; }
.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink-3); background: transparent; flex-shrink: 0;
  display: grid; place-items: center; padding: 0; transition: background .15s, border-color .15s;
}
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check svg { width: 16px; height: 16px; }
.row .act { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex-shrink: 0; }
.row .act svg { width: 19px; height: 19px; }

/* Копилка */
.goal { display: grid; gap: 12px; }
.goal-top { display: flex; gap: 14px; align-items: center; }
.goal-top .grow { flex: 1; min-width: 0; }
.goal-top .t { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.goal-top .m { color: var(--ink-2); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.amount-plus { color: var(--ok); font-weight: 700; } .amount-minus { color: var(--bad); font-weight: 700; }

/* Заметки */
.notes-grid { display: grid; gap: 10px; }
.note-card { border: 0; text-align: left; background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 6px; transition: transform .12s; width: 100%; }
.note-card:active { transform: scale(.98); }
.note-card .top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.note-card .top .when { margin-left: auto; color: var(--ink-3); font-weight: 500; }
.note-card .t { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.note-card .b { color: var(--ink-2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.search { position: relative; }
.search input[type=search] { padding-left: 42px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }

/* Поля */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; color: var(--ink-2); font-weight: 600; padding-left: 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], textarea, select {
  width: 100%; min-height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
  padding: 11px 14px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: none; min-height: 160px; line-height: 1.45; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input[type=date], input[type=time] { display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { position: relative; width: 52px; height: 32px; flex-shrink: 0; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }

/* Нижняя панель */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 4px) max(8px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabbar button { border: 0; background: none; color: var(--ink-3); display: grid; justify-items: center; gap: 3px; padding: 4px 0; min-height: 50px; font-size: 10.5px; font-weight: 600; transition: color .15s; }
.tabbar button svg { width: 25px; height: 25px; transition: transform .2s; }
.tabbar button.on { color: var(--accent); }
.tabbar button.on svg { transform: translateY(-1px); }

/* Листы снизу */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .25s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: calc(100% - var(--sat) - 12px);
  background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); will-change: transform;
  max-width: 600px; margin: 0 auto;
}
.sheet.show { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px 6px; position: relative; flex-shrink: 0; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line); }
.sheet-head h3 { margin: 14px 0 4px; font: 600 20px/1.2 var(--font-display); letter-spacing: -.01em; }
.sheet-head .icon-btn { width: 36px; height: 36px; margin-top: 10px; box-shadow: none; background: var(--surface-2); }
.sheet-head .icon-btn svg { width: 18px; height: 18px; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: grid; gap: 14px; align-content: start;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 18px) max(16px, env(safe-area-inset-left, 0px));
}
.confirm { display: grid; gap: 10px; background: var(--bad-soft); border-radius: var(--r-md); padding: 14px; }
.confirm p { margin: 0; color: var(--ink); font-weight: 600; }

/* Настройки */
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); position: relative; }
.swatch.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2.5px solid var(--ink); }
.icon-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.icon-choice { border: 2px solid transparent; background: var(--surface); border-radius: 18px; padding: 10px; display: grid; gap: 8px; justify-items: center; font-size: 13px; font-weight: 600; }
.icon-choice.on { border-color: var(--accent); }
.icon-choice img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.wid-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; background: var(--surface); }
.wid-row .grow { flex: 1; font-weight: 600; }

/* Пузыри */

.bubbles { position: relative; height: 360px; touch-action: pan-y; user-select: none; -webkit-user-select: none; contain: layout paint;
  background: radial-gradient(120% 80% at 50% 0%, var(--accent-soft), transparent 70%); }
.bub-layer { position: absolute; inset: 0; transform-origin: 50% 0; will-change: transform; }
.bub-layer.zin { animation: zin .38s cubic-bezier(.2, .9, .25, 1); } .bub-layer.zout { animation: zout .38s cubic-bezier(.2, .9, .25, 1); }
@keyframes zin { from { transform: scale(.82); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes zout { from { transform: scale(1.15); opacity: .4; } to { transform: none; opacity: 1; } }
.bub { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border: 0; padding: 0; background: none; touch-action: pan-y; cursor: pointer; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.bub.drag { transition: none; z-index: 3; }

.bub-c { position: absolute; inset: 0; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: 0; line-height: 1; overflow: hidden;
  background: var(--surface-2); color: var(--ink); border: 1.5px solid transparent;
  transform: scale(.2); opacity: 0; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1) var(--d, 0ms), opacity .25s ease var(--d, 0ms), box-shadow .2s; }
.bubbles.ready .bub-c { transform: none; opacity: 1; }
.bub b { font: 600 var(--fs, 16px)/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

:root[data-theme="dark"] { --mu-base: #3E434E; --mu-pri: #FF5A60; --mu-sec: #8C4448; --mu-skin: #2A2E36; --mu-sep: #181A1F; --mu-hair: #50555F; --mu-ln: #5A606B; }
